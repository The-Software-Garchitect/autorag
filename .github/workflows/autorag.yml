name: scheduled-tune

on:
  schedule:
    # Monday 06:15 UTC. Re-tunes on the PyTorch MiniLM. Not part of the push checks.
    - cron: "15 6 * * 1"
  workflow_dispatch:

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and the tuning extra
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[local]"
      - name: Retune the Acme handbook
        run: autorag tune --source data/acme
      - uses: actions/upload-artifact@v4
        with:
          name: tune-results
          path: data/acme/tune_results.json
