services:
  autorag:
    build: .
    ports:
      - "8091:8091"
    environment:
      AUTORAG_HOST: 0.0.0.0
      AUTORAG_GENERATOR: extractive
      HF_HOME: /opt/hf
    volumes:
      - autorag-runs:/app/runs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 40s

  # Optional local chat model. The API uses it only when AUTORAG_GENERATOR=ollama.
  #   docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  autorag-runs:
  ollama:
