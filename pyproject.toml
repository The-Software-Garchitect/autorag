[project]
name = "autorag"
version = "0.1.0"
description = "Self-tuning retrieval-augmented generation that turns a document folder into a cited question-answering API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sam" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "numpy>=1.26",
  "pydantic>=2",
  "pyyaml>=6",
  "sentence-transformers>=3",
  "httpx>=0.27",
  "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
chroma = ["chromadb>=0.5"]

[project.scripts]
autorag = "autorag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autorag*"]

[tool.setuptools.package-data]
autorag = ["service/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
